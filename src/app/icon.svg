<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1528" stop-opacity="1"/>
      <stop offset="70%" stop-color="#060c18" stop-opacity="1"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic 3D Shield Front Gradient -->
    <linearGradient id="shieldFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- 3D Bevel Highlight Gradient -->
    <linearGradient id="shieldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 3D Side Shadow Gradient -->
    <linearGradient id="shieldDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b4d"/>
      <stop offset="50%" stop-color="#001833"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>

    <!-- Glowing Orbit Ring Gradient -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Core AI Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00e676" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)"/>
  
  <!-- Outer Hexagonal Cyber Border -->
  <polygon points="256,20 440,126 440,386 256,492 72,386 72,126" 
           fill="none" stroke="url(#shieldFront)" stroke-width="4" opacity="0.4"/>
  <polygon points="256,32 428,131 428,381 256,480 84,381 84,131" 
           fill="none" stroke="url(#orbitGrad1)" stroke-width="2" opacity="0.25"/>

  <!-- Back Ambient Glow Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" filter="url(#glowHeavy)" opacity="0.6"/>

  <!-- 3D Orbit Ring 1 (Back segment) -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="215" ry="75" fill="none" stroke="url(#orbitGrad1)" stroke-width="6" stroke-dasharray="140 80 100 60" filter="url(#glowLight)"/>
    <circle cx="471" cy="256" r="12" fill="#00f2fe" filter="url(#glowHeavy)"/>
    <circle cx="471" cy="256" r="5" fill="#ffffff"/>
  </g>

  <!-- 3D Orbit Ring 2 (Back segment) -->
  <g transform="rotate(35 256 256)">
    <ellipse cx="256" cy="256" rx="205" ry="65" fill="none" stroke="url(#orbitGrad2)" stroke-width="5" stroke-dasharray="90 50 120 40" filter="url(#glowLight)"/>
    <circle cx="51" cy="256" r="10" fill="#00e676" filter="url(#glowHeavy)"/>
    <circle cx="51" cy="256" r="4" fill="#ffffff"/>
  </g>

  <!-- 3D Shield Base Shadow (3D Depth Extrusion 3) -->
  <path d="M 256 96 L 376 156 V 266 C 376 356 256 416 256 416 C 256 416 136 356 136 266 V 156 Z" 
        fill="#010610" transform="translate(0, 16)"/>

  <!-- 3D Shield Wall (3D Depth Extrusion 2) -->
  <path d="M 256 92 L 372 152 V 262 C 372 352 256 412 256 412 C 256 412 140 352 140 262 V 152 Z" 
        fill="url(#shieldDepth)" transform="translate(0, 8)"/>

  <!-- 3D Shield Front Surface -->
  <path d="M 256 84 L 368 144 V 254 C 368 344 256 404 256 404 C 256 404 144 344 144 254 V 144 Z" 
        fill="url(#shieldFront)"/>

  <!-- 3D Facet Shading (Left side reflection, Right side shadow) -->
  <!-- Left Side Facet -->
  <path d="M 256 84 L 144 144 V 254 C 144 344 256 404 256 404 Z" fill="url(#shieldHighlight)"/>

  <!-- Right Side Shadow Overlay -->
  <path d="M 256 84 L 368 144 V 254 C 368 344 256 404 256 404 Z" fill="#000e26" opacity="0.25"/>

  <!-- Inner Dark Core Shield Container -->
  <path d="M 256 125 L 334 165 V 245 C 334 310 256 355 256 355 C 256 355 178 310 178 245 V 165 Z" 
        fill="#040b18" stroke="url(#shieldFront)" stroke-width="3" filter="url(#glowLight)"/>

  <!-- AI Diamond Crystal Center -->
  <!-- Back Diamond Glow -->
  <polygon points="256,165 306,235 256,305 206,235" fill="url(#shieldFront)" filter="url(#glowHeavy)"/>
  
  <!-- Outer Crystal Facets -->
  <polygon points="256,170 300,235 256,300 212,235" fill="#00f2fe"/>
  <polygon points="256,170 256,300 212,235" fill="#ffffff" opacity="0.4"/>
  <polygon points="256,170 300,235 256,300" fill="#00b4d8" opacity="0.6"/>

  <!-- Center Core AI Sparkle -->
  <circle cx="256" cy="235" r="18" fill="url(#coreGlow)" filter="url(#glowHeavy)"/>
  <circle cx="256" cy="235" r="8" fill="#ffffff"/>

  <!-- Cross Flare Sparkle Lines -->
  <path d="M 256 200 L 256 270 M 221 235 L 291 235" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glowLight)"/>

  <!-- Front Glass Gloss Light Reflection -->
  <path d="M 160 152 Q 256 112 352 152 Q 310 232 160 152 Z" fill="#ffffff" opacity="0.3"/>
</svg>
